<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentory</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="header-top">
          <div class="identity">
            <h1>Sentory</h1>
            <p>이야기 속, 흩어진 순간들을 한 곳에</p>
            <div id="detection-status" class="detection-status" hidden>
              <span class="detection-dot"></span>
              <span>Discord 감지</span>
              <strong id="detection-status-text"></strong>
            </div>
          </div>

          <div class="header-actions">
            <label class="search-box">
              <span class="fluent search-icon" aria-hidden="true">&#xE721;</span>
              <input id="search" type="search" aria-label="보관함 검색" placeholder="제목, URL, 도메인 검색" autocomplete="off" />
            </label>
            <button id="theme" class="icon-button" type="button" aria-label="다크 테마로 전환" title="다크 테마로 전환">
              <span class="fluent" aria-hidden="true">&#xE708;</span>
            </button>
          </div>
        </div>

        <div class="control-row">
          <nav class="tabs" aria-label="콘텐츠 종류">
            <button class="tab active" type="button" data-kind="all">전체</button>
            <button class="tab" type="button" data-kind="Url">링크</button>
            <button class="tab" type="button" data-kind="Image">사진</button>
            <button class="tab" type="button" data-kind="favorite">
              <span class="fluent favorite-glyph" aria-hidden="true">&#xE735;</span>
              <span>즐겨찾기</span>
            </button>
          </nav>

          <div class="tools">
            <button id="filter" class="toolbar-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="fluent" aria-hidden="true">&#xE71C;</span>
              <span>필터</span>
              <span id="filter-count" class="filter-count" hidden>0</span>
              <span class="fluent chevron" aria-hidden="true">&#xE70D;</span>
            </button>
            <button id="sort" class="toolbar-button" type="button" aria-haspopup="menu" aria-expanded="false">
              <span class="fluent" aria-hidden="true">&#xE8CB;</span>
              <span id="sort-label">정렬 최신순</span>
              <span class="fluent chevron" aria-hidden="true">&#xE70D;</span>
            </button>
            <button id="select-mode" class="toolbar-button" type="button">
              <span class="fluent" aria-hidden="true">&#xE762;</span>
              <span>선택</span>
            </button>
            <button id="settings" class="toolbar-button" type="button">
              <span class="fluent" aria-hidden="true">&#xE713;</span>
              <span>설정</span>
            </button>
            <button id="refresh" class="visually-hidden" type="button">새로 고침</button>
            <section id="filter-menu" class="popup filter-menu" hidden aria-label="필터">
              <div class="popup-heading">
                <strong>필터</strong>
                <button id="filter-reset" type="button">초기화</button>
              </div>
              <div class="filter-columns">
                <div>
                  <h2>메신저</h2>
                  <div id="source-options" class="menu-options"></div>
                </div>
                <div>
                  <h2>기간</h2>
                  <div id="date-options" class="menu-options">
                    <button type="button" data-date="All">전체 기간</button>
                    <button type="button" data-date="Today">오늘</button>
                    <button type="button" data-date="Last7Days">최근 7일</button>
                    <button type="button" data-date="Last30Days">최근 30일</button>
                  </div>
                </div>
              </div>
            </section>
            <section id="sort-menu" class="popup sort-menu menu-options" hidden aria-label="정렬">
              <button type="button" data-sort="Newest">정렬 최신순</button>
              <button type="button" data-sort="Oldest">정렬 오래된순</button>
              <button type="button" data-sort="MostCaptured">가장 많이 저장한 순</button>
              <button type="button" data-sort="MostCopied">가장 많이 복사한 순</button>
              <button type="button" data-sort="RecentlyCopied">최근 복사한 순</button>
              <button type="button" data-sort="Name">이름순</button>
            </section>
          </div>
        </div>
      </header>

      <section class="gallery-region" aria-live="polite">
        <div id="status" class="status">C# 엔진에서 보관함을 읽는 중…</div>
        <div id="scroller" class="scroller" tabindex="0">
          <div id="virtual-space" class="virtual-space"></div>
        </div>
        <div id="scroll-indicator" class="scroll-indicator" aria-hidden="true">
          <div class="scroll-indicator-thumb"></div>
        </div>
        <div id="selection-rectangle" class="selection-rectangle" hidden></div>
        <div id="selection-bar" class="selection-bar" hidden>
          <strong id="selected-count">0개 선택</strong>
          <button id="select-visible" type="button">보이는 항목 선택</button>
          <button id="clear-selection" type="button">선택 취소</button>
          <button id="delete-selected" class="danger-action" type="button">선택 항목 삭제</button>
        </div>
      </section>
    </main>

    <div id="detail-layer" class="modal-layer" hidden>
      <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detail-title">
        <button id="detail-close" class="detail-close fluent" type="button" aria-label="닫기">&#xE711;</button>
        <div class="detail-heading">
          <span id="detail-type"></span>
          <strong id="detail-favorite-mark" hidden>즐겨찾기</strong>
          <h2 id="detail-title">항목 상세</h2>
        </div>
        <div class="detail-content">
          <div id="detail-artwork" class="detail-artwork"></div>
          <div class="detail-info">
            <p id="detail-description"></p>
            <dl>
              <div><dt>저장 횟수</dt><dd id="detail-capture-count"></dd></div>
              <div><dt>복사 횟수</dt><dd id="detail-copy-count"></dd></div>
              <div><dt>메신저</dt><dd id="detail-source"></dd></div>
              <div><dt>저장 시각</dt><dd id="detail-date"></dd></div>
              <div><dt>저장 상태</dt><dd id="detail-delivery"></dd></div>
            </dl>
          </div>
        </div>
        <div class="detail-actions">
          <button id="detail-delete" class="danger-text" type="button">삭제</button>
          <span></span>
          <button id="detail-open" type="button">원본 열기</button>
          <button id="detail-copy" class="primary-action" type="button">복사</button>
        </div>
      </section>
    </div>

    <div id="confirm-layer" class="modal-layer" hidden>
      <section class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
        <h2 id="confirm-title">항목을 삭제할까?</h2>
        <p id="confirm-message">삭제한 항목은 되돌릴 수 없어.</p>
        <div>
          <button id="confirm-cancel" type="button">취소</button>
          <button id="confirm-ok" class="danger-action" type="button">삭제</button>
        </div>
      </section>
    </div>
    <div id="toast" class="toast" hidden></div>
  </body>
</html>
